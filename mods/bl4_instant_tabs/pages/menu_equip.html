<widget-menu-equip hide-flags-enabled="true"
                   class="status_menu_fade">
    <oak-parallax-effect id="equipment_container"
                         name="equipment_container"
                         class="equipment__container parallax_container">
        <div name="equipment"
             class="equipment menu_screen_boundaries">
            <div name="Weapon Wheel"
                 data-bind-class-toggle="invisible:!{{$data.bshowequipment}}"
                 data-bind-input-disabled="!{{$data.bshowequipment}}"
                 class="weapon-wheel">
                <div name="Weapon Wheel Container"
                     class="equip_weap_wheel_container">
                    <div name="FUI blue corner container"
                         class="fui_blue_corner">
                        <div name="top left"
                             class="fui_blue_corner_1 parallax_effect fuilayer_3 parallax_transition_2"></div>
                        <div name="top right"
                             class="fui_blue_corner_2 parallax_effect fuilayer_3 parallax_transition_2"></div>
                        <div name="bot right"
                             class="fui_blue_corner_3 parallax_effect fuilayer_3 parallax_transition_2"></div>
                        <div name="bot left"
                             class="fui_blue_corner_4 parallax_effect fuilayer_3 parallax_transition_2"></div>
                    </div>
                    <div name="FUI lines container"
                         class="me_fui_corner_lines">
                        <div name="top left"
                             class="equip_fui_lines_1 parallax_effect parallax_transition_1 fuilayer_1"></div>
                        <div name="top right"
                             class="parallax_effect parallax_transition_1 fuilayer_1 equip_fui_lines_2"></div>
                        <div name="bot right"
                             class="parallax_effect parallax_transition_1 fuilayer_1 equip_fui_lines_3"></div>
                        <div name="bot left"
                             class="parallax_effect parallax_transition_1 fuilayer_1 equip_fui_lines_4"></div>
                    </div>
                    <oak-equip-slot name="Weapon1 Slot"
                                    slot-ident="weapon0"
                                    data-bind-click="$widget.OnEquipmentSlotClicked('weapon', 0)"
                                    data-bind-mouseenter="$widget.OnEquipmentSlotFocused('weapon', 0)"
                                    data-bind-mouseleave="$widget.OnEquipmentSlotUnfocused()"
                                    gue-comment="&quot;compare&quot; class should be toggle in the weapon# Slot for the Slot compare state"

                        <div name="number container"
                             class="weap_wheel_number_container"></div>
                        <p name="Text"
                           data-l10n-id="WeaponWheelSlotNumber1"
                           class="weap_wheel_slot_number"></p>
                        <div name="Slot Background"
                             class="equip_weap_wheel_slot_bkg">
                            <div name="hit area"
                                 class="weapon_slot_hit_area_container">
                                <div name="hit area 7"
                                     class="weapon_slot_hit_area_7"></div>
                                <div name="hit area 6"
                                     class="weapon_slot_hit_area_6"></div>
                                <div name="hit area 5"

                                <div name="hit area 1"
                                     class="weapon_slot_hit_area_7 weapon_slot_hit_area_1"></div>
                            </div>
                            <div name="backing"
                                 class="weap_wheel_slot_background"></div>
                            <div name="color"
                                 gue-comment="here is where rarity colors are applied"
                                 class="oak_equip_slot_color rarity empty_color">

                                     class="weap_wheel_slot_outline"></div>
                                <div name="empty icon"
                                     data-bind-class-toggle="hidden:!$widget.GetEquipementSlotDataFromTypeAndSubIndex('weapon', 0, {{$data}})?.isempty"

                                    <gbx-component gbx-component-id="element_damage_type"

                                </div>

                                 class="orange_fui_container_hover">
                                <div name="Orange fui hover container 1"

                                    <div name="left"

                                    <div name="left"
                                         class="orange_fui_left"></div>
                                    <div name="middle"

                                     data-bind-class-toggle="collapsed:!$widget.GetEquipementSlotDataFromTypeAndSubIndex('enhancement', 0, {{$data}})?.isfirmware"
                                     class="icon_container">
                                    <div name="firmware placeholder icon"
                                         data-bind-class="$widget.GetEquipementSlotDataFromTypeAndSubIndex('enhancement', 0, {{$data}})?.firmwareident"
                                         class="firmware_icon_placeholder icon_bkg_sm"></div>
                                </div>
                            </div>
                            <div name="outline hover"
                                 class="passive_gear_outline_hover gear_outline_hover"></div>
                            <div data-bind-if="$widget.GetEquipementSlotDataFromTypeAndSubIndex('enhancement', 0, {{$data}})?.thumbnailicon != 'none'"
                                 data-bind-style-background-image-url="$widget.GetEquipementSlotDataFromTypeAndSubIndex('enhancement', 0, {{$data}})?.thumbnailicon"

                                 class="gear_slot_thumbnail passive_gear_slots_item_position"></div>
                            <gbx-component name="rarity_pips"

                                           data-bind-oak-rarity="$widget.GetEquipementSlotDataFromTypeAndSubIndex('enhancement', 0, {{$data}})?.rarityident"
                                           class="rarity_pip_position_passive_gear gadget_rarity_pip"></gbx-component>
                            <div name="item type"
                                 class="item_cell_type_icon rarity bright me_passivegear_itemtype_position me_size"></div>
                            <div class="gear_slot_compare_icon"></div>
                            <div class="gear_slot_new_icon"></div>
                            <div name="mark icons"
                                 class="gear_slot_icons_container">
                                <div class="gear_slot_icon"></div>
                            </div>
                            <div name="lock icon container"
                                 class="me_equip_slot_locked_icon_cntr position_absolute_flex_center gadget_lock_position">
                                <div name="Locked Detail"
                                     class="gear_slot_locked_detail"></div>
                            </div>
                        </div>
                    </oak-equip-slot>
                </div>
            </div>
            <oak-cursor-handler name="Reward Center CTA button"
                                data-bind-class-toggle="invisible:!{{$data.bshowrewardprompt}}"
                                data-bind-mouseenter="$widget.OnRewardCenterFocused(event)"
                                data-bind-mouseleave="$widget.OnRewardCenterUnfocused(event)"
                                data-bind-click="$widget.Input_OpenRewardCenter()"
                                class="mrc_cta_btn_wrapper">
                <div name="Content"
                     class="mrc_cta_btn">
                    <div name="Border"
                         class="mrc_cta_btn_border"></div>
                    <div name="Hover"
                         class="mrc_cta_btn_hover_content">
                        <div name="Pip L"
                             class="mrc_cta_btn_orange_fui left"></div>
                        <div name="Pip R"
                             class="mrc_cta_btn_orange_fui right"></div>
                    </div>
                    <div name="Pips"
                         class="mrc_cta_btn_pips"></div>
                    <div name="Cap"
                         class="mrc_cta_btn_cap">
                        <div name="Squares hover"
                             class="mrc_cta_btn_cap_hover"></div>
                        <div name="Squares hover"
                             class="mrc_cta_btn_cap_hover right"></div>
                    </div>
                    <div name="Icon"
                         class="mrc_icon_closed"></div>
                    <div name="Title"
                         class="mrc_cta_btn_title">
                        <div name="BG"
                             class="mrc_cta_btn_title_bg"></div>
                        <gbx-glyph action="action_ui_open_reward_center"
                                   submap=""
                                   class="mrc_glyph_btn_icon"></gbx-glyph>
                        <div name="Number"
                             data-bind-value="{{$data.numunclaimedrewards}}"
                             class="mrc_cta_btn_text med_text_2 mrc_cta_btn_value">NUM_UNCLAIMED_REWARDS</div>
                    </div>
                </div>
                <div name="pip_container"
                     class="me_pip_container">
                    <div name="pip"
                         data-bind-class-toggle="inactive:!{{$data.pipdata.activepips}}.includes('any_rewards')"
                         class="pip menu_equip_pip_position"></div>
                </div>
            </oak-cursor-handler>
        </div>
        <div name="item_dropdown_bounding_box"
             class="item_dropdown_bounding_box"></div>
    </oak-parallax-effect>
