[project]
name = "BL4 Reroll"
version = "0.1.1"
description = "Reroll the modifiers on class mods and enhancements for Eridium: 25 to reroll them all, 50 to replace one (both changeable in its settings). Each item gets a page in the mod menu (F7); or type reroll in the console."
authors = [{ name = "flame" }]

[tool.sdkmod]
supported_games = ["BL4"]
