<widget-skills id="widget-skills"
               hide-flags-enabled="true"
               data-bind-class-toggle="inactive:{{$data.isplayerstatsopened}}"
               class="skills_tree_wrapper status_menu_fade">
    <oak-parallax-effect name="parallax container"
                         class="skills_tree_boundaries parallax_container">
        <gbx-component name="skills_loadout"
                       id="skills_loadout"
                       gbx-component-id="skills_loadout"></gbx-component>
        <div name="skill_tree_name"
             class="skill_tree_points_container">
            <p name="Text"
               id="skill_tree_name"
               class="skill_tree_name_text">Skill Tree Name</p>
            <div name="points invested"
                 class="skill_tree_points_invested_container">
                <div class="name_skill_point_invested_background">
                    <p name="Text"
                       id="points_invested"
                       class="points_invested_number small_text_2">0</p>
                </div>
                <p name="Text"
                   data-l10n-id="PointsInvestedText"
                   class="points_invested_text small_text_2"></p>
            </div>
        </div>
        <div name="class mod slot container"
             class="character_class_container">
            <div name="class mod slot"
                 id="class_mod_slot"
                 tooltip-data-key="tooltip_class_mod"
                 class="class_mod_slot">
                <div name="class mod slot deco"
                     gue-comment="when class mod is equipped\ncolor tint is applied"
                     class="class_mod_equipped class_mod_slot_deco class_mod_slot_deco_equipped"></div>
                <div name="class mod background"
                     class="class_mod_slot_background"></div>
                <div name="class mod empty"
                     data-bind-class-toggle="invisible:{{$data.classmod.isequipped}}"
                     class="class_mod_empty_icon"></div>
                <div name="class mod equipped"
                     data-bind-class-toggle="invisible:!{{$data.classmod.isequipped}}"
                     class="class_mod_equipped_container">
                    <div name="class mod inner glow"
                         class="class_mod_inner_glow"></div>
                    <div name="class mod icon"
                         class="skill_class_mod_icon"></div>
                </div>
            </div>
            <div name="class text container"
                 class="class_mod_text_container">
                <p name="Text"
                   data-bind-value="{{$data.classmod.name}}"
                   class="character_class_text">Character Class Name</p>
            </div>
        </div>
        <div name="skills_tree_container"
             class="skills_tree_container">
            <div name="Top Arrows - split horizontal"
                 class="skill_tree_top_arrows inactive">
                <div name="Left"
                     class="action_skill_glyph_left skill_tree_top_arrow">
                    <gbx-glyph action=""
                               submap=""
                               gue-comment="Add Glyph here"
                               max_num_glyph="1"
                               data-input-friction="true"
                               id=""></gbx-glyph>
                    <div name="arrow"
                         class="action_skill_glyph_icon_arrow"></div>
                </div>
                <div name="Right"
                     class="action_skill_glyph_left action_skill_glyph_flip skill_tree_top_arrow">
                    <gbx-glyph action=""
                               submap=""
                               gue-comment="Add Glyph here"
                               max_num_glyph="1"
                               data-input-friction="true"
                               id=""></gbx-glyph>
                    <div name="arrow"
                         class="action_skill_glyph_icon_arrow"></div>
                </div>
            </div>
            <div name="Bottom Arrows - split horizontal"
                 class="skill_tree_bottom_arrows inactive">
                <div name="Left"
                     class="action_skill_glyph_left skill_tree_bottom_arrow">
                    <gbx-glyph action=""
                               submap=""
                               gue-comment="Add Glyph here"
                               max_num_glyph="1"
                               data-input-friction="true"
                               id=""></gbx-glyph>
                    <div name="arrow"
                         class="action_skill_glyph_icon_arrow"></div>
                </div>
                <div name="Right"
                     class="action_skill_glyph_left action_skill_glyph_flip skill_tree_bottom_arrow">
                    <gbx-glyph action=""
                               submap=""
                               gue-comment="Add Glyph here"
                               max_num_glyph="1"
                               data-input-friction="true"
                               id=""></gbx-glyph>
                    <div name="arrow"
                         class="action_skill_glyph_icon_arrow"></div>
                </div>
            </div>
            <div name="Action Skill"
                 class="skill_tree_icons">
                <div name="left action skill wrapper"
                     class="action_skill_wrapper_left">
                    <div name="Left Action Skill"
                         data-input-friction="true"
                         id="skill_tree_left"
                         class="action_skill_container_left action_skill_disabled_state">
                        <div name="color2 action_skill_background_side"
                             gue-color="#F60"
                             class="action_skill_background_side_left action_skill_color"></div>
                        <div name="skill_tree_icon"
                             id="skill_tree_icon_left"
                             class="action_skill_icon_side"></div>
                        <div name="equipped_icon"
                             class="action_skill_equip_icon action_skill_equip_icon_side invisible"></div>
                        <div name="skill invested"
                             class="skill_point_invested_background">
                            <p name="Text"
                               class="points_invested_number">0</p>
                        </div>
                    </div>
                </div>
                <div name="left glyph container"
                     id="action_skill_glyph_left"
                     class="action_skill_glyph_left">
                    <gbx-glyph action="action_ui_menu_sub_tab_left"
                               submap=""
                               max_num_glyph="1"
                               data-input-friction="true"
                               id="nav_left"></gbx-glyph>
                    <div name="arrow"
                         class="action_skill_glyph_icon_arrow"></div>
                </div>
                <div class="action_skill_wrapper_center">
                    <div name="Center Action Skill"
                         data-input-friction="true"
                         id="skill_tree_center"
                         data-input-id="action_skill"
                         data-input-link-down="2"
                         data-input-elem="true"
                         class="action_skill_container_center action_skill_disabled_state">
                        <div name="action_skill_background"
                             class="action_skill_background">
                            <div name="color2 action_skill_deco"
                                 gue-color="#F60"
                                 class="action_skill_deco"></div>
                            <div name="action_skill_gradient"
                                 class="action_skill_grdnt"></div>
                            <div name="action_skill_outline"
                                 class="action_skill_outline"></div>
                            <div name="action_skill_outline_hover"
                                 class="action_skill_hover"></div>
                            <div name="action skill equippable anim"
                                 class="equippable_anim_action_skill inactive"></div>
                            <div name="equipped action skill deco"
                                 class="action_skill_deco_equip invisible"></div>
                        </div>
                        <div name="skill_tree_icon"
                             id="skill_tree_icon_center"
                             class="action_skill_icon"></div>
                        <div name="equipped icon"
                             class="action_skill_equip_icon invisible"></div>
                    </div>
                </div>
                <div name="right glyph container"
                     id="action_skill_glyph_right"
                     class="action_skill_glyph_left action_skill_glyph_flip">
                    <gbx-glyph action="action_ui_menu_sub_tab_right"
                               submap=""
                               max_num_glyph="1"
                               data-input-friction="true"
                               id="nav_right"
                               class="skills_glyph_flip"></gbx-glyph>
                    <div name="arrow"
                         class="action_skill_glyph_icon_arrow"></div>
                </div>
                <div name="right action skill wrapper"
                     class="action_skill_wrapper_right">
                    <div name="Right Action Skill"
                         data-input-friction="true"
                         id="skill_tree_right"
                         class="action_skill_container_right action_skill_disabled_state">
                        <div name="color2 action_skill_background_side"
                             gue-color="#F60"
                             class="action_skill_background_side_right action_skill_color"></div>
                        <div name="skill_tree_icon"
                             id="skill_tree_icon_right"
                             class="action_skill_icon_side"></div>
                        <div name="equipped_icon"
                             class="action_skill_equip_icon action_skill_equip_icon_side invisible"></div>
                        <div name="skill invested"
                             class="skill_point_invested_background">
                            <p name="Text"
                               class="points_invested_number">0</p>
                        </div>
                    </div>
                </div>
            </div>

                    <div name="color2 connect shape"
                         gue-color="#F60"

                </div>
                <div name="FUI right side"
                     class="skill_fui_wrapper skill_fui_wrapper_right">
                    <div name="parallax"
                         class="parallax_effect fuilayer_1 parallax_transition_2">
                        <div name="action skills deco"
                             class="fui_action_skills fui_action_skills_flip">
                            <div name="color3 lines"

                    </div>
                    <div name="parallax"

                            <div name="color3 trunk glow"

                                 class="fui_trunk_connect_glow skill_color_3"></div>
                            <div name="color3 trunk glow2"
                                 gue-color="#D22"
                                 class="fui_trunk_connect_glow_bottom skill_color_3"></div>
                            <div name="color2 bright dots hor"

                                 class="fui_trunk_connect_dot_hor skill_color_2"></div>
                            <div name="color2 bright dots ver"
                                 gue-color="#F60"
                                 class="fui_trunk_connect_dot_ver skill_color_2"></div>
                            <div name="color3 connecting lines"
                                 gue-color="#D22"
                                 class="fui_trunk_connect_lines skill_color_3"></div>
                            <div name="color2 connect shape"
                                 gue-color="#F60"
                                 class="fui_trunk_connect_shape skill_color_2"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div name="Scrolling Content"

                 data-input-id="skills_tree_container"

                    <div name="brackets bottom"

                    <div name="color2 trunk backing fill"

                    <div name="trunk tree"
                         class="trunk_tiers_container">
                        <div name="tier 1"

                                           id="skill_node"

                 boundarytype="navbar"
                 class="tooltip_container">
        <div data-bind-if="{{$data.tooltip.isactivated}} && !{{$data.tooltip.isactionskillactive}} && {{$data.nodetype}} !== 1"
             name="Tag"
             class="skill_tooltip_tag_cntr display_flex_relative">
            <div name="Tag Equipped"
                 class="skill_tooltip_tag_equipped">
                <div name="BG"
                     class="skill_tooltip_tag_bg_equipped">
                    <div name="Icon Equipped"
                         class="skill_tooltip_tag_icon_equipped"></div>
                    <div data-l10n-id="CurrentlyEquippedText"

                         class="skill_tooltip_tag_text small_text_2 skill_tooltip_tag_text_equipped">Currently Equipped</div>
                </div>
            </div>
        </div>
        <div data-bind-if="{{$data.tooltip.isactionskillactive}}"
             name="Tag"
             class="skill_tooltip_tag_cntr display_flex_relative">
            <div name="Skill on Cooldown"
                 class="skill_tooltip_tag_skill_cooldown">
                <div data-bind-if="!{{$data.tooltip.isactivated}}"
                     name="BG"
                     class="skill_tooltip_tag_bg_skill_cooldown">

                         class="skill_tooltip_tag_skill_cooldown_pattern"></div>

            </div>

                         class="tooltip_title_text_container">

                             class="tooltip_title_text med_text_1"></div>

                         name="Subtitle"
                         class="tooltip_title_text_container">

                             name="Text"
                             class="tooltip_subtitle_text med_text_2"></div>

                         name="Points"
                         class="tooltip_title_text_container">

                             id="skill_tooltip_points_text"
                             data-bind-class="{{$data.tooltip.totalprogresspoints}} > 0 ? 'skill_color_1' : None"
                             class="skill_tooltip_points_text small_text_1"></div>
                    </div>
                    <div data-bind-if="{{$data.tooltip.notifytext}} != '' && !{{$data.tooltip.issoftactivated}} && {{$data.tooltip.isunlocked}}"
                         name="Notify Container"
                         class="skill_tooltip_notify_cntr">
                        <div name="Glowing borders"
                             class="skill_tooltip_notify_glow_borders">

                                 class="skill_tooltip_notify_border left"></div>
                            <div name="border"
                                 class="skill_tooltip_notify_border right"></div>
                        </div>
                        <div name="Notify"
                             class="skill_tooltip_notify">

                                 name="Text"
                                 class="skill_tooltip_notify_text small_text_2"></div>
                        </div>
                    </div>
                    <div name="divider"
                         class="tooltip_line_separator"></div>
                    <oak-auto-scroll name="Auto Scroll Cntr"
                                     class="skill_tooltip_autoscroll_cntr">
                        <div name="Content"
                             data-bind-if="{{$data.tooltip.bodytext}} != '' || {{$data.tooltip.statstext}} != ''"
                             gue-color="#11D"
                             class="skill_tooltip_body_text">
                            <div name="Image Wrapper"
                                 data-bind-if="{{$data.tooltip.image}} != '' && SplitSettings.SplitMode != SplitModes.horizontal"
                                 class="skill_tooltip_image_wrapper">
                                <div name="Image"
                                     data-bind-style-background-image-url="{{$data.tooltip.image}}"
                                     class="skill_tooltip_image"></div>
                                <div name="divider"
                                     class="tooltip_line_separator"></div>
                            </div>
                            <p name="description"
                               data-bind-if="{{$data.tooltip.bodytext}} != ''"
                               data-bind-markup="{{$data.tooltip.bodytext}}"
                               class="menu_skill_tooltip_text tooltip_content_body_text small_text_2"></p>
                            <div name="stats"
                                 data-bind-if="{{$data.tooltip.statstext}} != ''"
                                 data-bind-markup="{{$data.tooltip.statstext}}"
                                 class="skill_tooltip_text tooltip_content_body_text small_text_2"></div>
                        </div>
                    </oak-auto-scroll>
                </div>
            </div>
            <div name="hints"
                 data-bind-class-toggle="inactive:{{$data.tooltip.hintentries}}.length === 0"
                 class="tooltip_button_glyph_wrapper">
                <div name="divider"
                     class="tooltip_line_separator"></div>
                <div class="skill_tooltip_button_glyph_container flex_column">
                    <div data-bind-for="entry:{{$data.tooltip.hintentries}}">
                        <div class="skill_tooltip_hint_bar_entry display_flex_center">
                            <div class="skill_tooltip_hint_bar_entry_inner tooltip_button_glyph_container">
                                <gbx-glyph action=""
                                           submap=""
                                           data-bind-attribute-value="{'action':{{entry.input_action}}}"
                                           max_num_glyph="1"
                                           class="tooltip_hint_bar_glyph_cntr"></gbx-glyph>
                                <div data-bind-localization-markup="{{entry.loc_text}}"
                                     class="tooltip_button_glyph_text small_text_2"></div>
                            </div>
                            <div class="tooltip_hint_bar_border_effect"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </gbx-tooltip>
