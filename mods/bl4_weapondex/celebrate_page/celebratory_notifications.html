<widget-notification-message class="celeb_notification_widget_container safe-area">
    <div name="celeb notif wrapper"
         class="celeb_notif_wrapper hud_text_stroke celeb_notif_wrapper">
        <div name="Generic Notification"
             data-bind-class-toggle="invisible:{{$data.messagetype}}!=&quot;generic_notification&quot;"
             gue-color="#D22"
             class="celeb_notif">
            <div name="FUI-Top"
                 class="celeb_fui_top"></div>
            <div name="icon container"
                 data-bind-class-toggle="invisible:!{{$data.bshowheadericon}}"
                 class="celeb_notif_icon_container">
                <div name="celeb notif background"
                     class="celeb_notif_icon_bkgd2"></div>
                <div name="celeb notif icon"
                     data-bind-class="{{$data.headericontype}}"
                     class="celeb_notif_icon"></div>
            </div>
            <div name="verb descriptor container"
                 data-bind-class-toggle="inactive:!{{$data.body}}"
                 class="verb_descriptor_container">
                <div name="verb descriptor background"
                     class="celeb_notif_verb_description_bkgd"></div>
                <div name="verb description txt"
                     data-bind-value="{{$data.body}}"
                     class="celeb_notif_verb_description_txt verb_descriptor_txt_generic"></div>
            </div>
            <div name="dividing line"
                 class="dividing_line"></div>
            <div name="celeb_notif txt"
                 data-bind-value="{{$data.header}}"
                 class="celeb_notif_txt"></div>
            <div name="celeb notif btn prompt"
                 data-bind-class-toggle="inactive:!{{$data.inputaction}}"
                 class="celeb_sn_notif_btn_prompt">
                <div class="celeb_notif_btn_bkg">
                    <gbx-glyph action=""
                               submap=""
                               data-bind-attribute-value="{'action':{{$data.inputaction}}}"
                               class="celeb_notif_glyph"></gbx-glyph>
                </div>
                <div name="celeb btn txt"
                     data-bind-value="{{$data.buttonprompt}}"
                     class="celeb_notif_contextual_txt tooltip_button_glyph_text"></div>
            </div>
            <div name="FUI-Bottom"
                 class="celeb_fui_bottom"></div>
        </div>
        <div name="Special Notification"
             data-bind-class-toggle="invisible:{{$data.messagetype}}!=&quot;special_notification&quot; && {{$data.messagetype}}!=&quot;takedown_notification&quot;"
             gue-color="#11D"
             class="celeb_special_notif_cntr">
            <div name="Notification Background"
                 class="celeb_sn_notif_bkg">
                <div name="Vault icon background"
                     data-bind-class="{{$data.headericontype}}"
                     class="celeb_sn_vault_icon_bkg"></div>
            </div>
            <div name="celeb notif"
                 data-bind-class-toggle="invisible:!{{$data.header}}"
                 class="celeb_special_notif">
                <div name="FUI-Top"
                     data-bind-class-toggle="inactive:{{$data.headericontype}} == &quot;second_wind&quot;"
                     class="celeb_sn_fui_top">
                    <div name="Left"
                         class="celeb_sn_fui_top_left">
                        <div name="Fui Left"
                             class="celeb_sn_fui_left"></div>
                        <div name="Decor Left"
                             class="celeb_sn_decor_left"></div>
                        <div name="Bits Left"
                             class="celeb_sn_bit_left"></div>
                    </div>
                    <div name="Right"
                         class="celeb_sn_fui_top_right">
                        <div name="Fui right"
                             class="celeb_sn_fui_right"></div>
                        <div name="Decor right"
                             class="celeb_sn_decor_right"></div>
                        <div name="Bits right"
                             class="celeb_sn_bit_right"></div>
                    </div>
                </div>
                <div name="icon container"
                     data-bind-class-toggle="inactive:!{{$data.bshowheadericon}}"
                     class="celeb_sn_notif_icon_container">
                    <div name="celeb notif background"
                         class="celeb_sn_notif_icon_bkgd2"></div>
                    <div name="celeb notif icon"
                         data-bind-class="{{$data.headericontype}}"
                         gue-comment="VC note: I'm not sure how the VC icons\nare being called, so I didn't make a css for it"
                         class="celeb_sn_notif_icon"></div>
                    <div name="focus top fx"
                         class="celeb_sn_focus_top_fx"></div>
                    <div name="vault background"></div>
                </div>
                <div name="verb descriptor container"
                     data-bind-class-toggle="inactive:!{{$data.body}}"
                     class="verb_sn_descriptor_container">
                    <div name="verb descriptor background"
                         class="celeb_sn_notif_verb_description_bkgd"></div>
                    <div name="arrows"
                         class="verb_descriptor_arrows"></div>
                    <div name="verb description txt"
                         data-bind-value="{{$data.body}}"
                         data-bind-class="{{$data.headericontype}}+'_vaultcard'"
                         class="celeb_notif_verb_description_txt"></div>
                </div>
                <div name="celeb_sn_notif txt"
                     data-bind-value="{{$data.header}}"
                     class="celeb_sn_notif_txt"></div>
                <div name="Rewards and prompt"
                     gue-comment="inactive if there are no rewards or button prompts"
                     data-bind-class-toggle="inactive:!{{$data.inputaction}} && !{{$data.reward}}"
                     class="celeb_notif_reward_wrapper">
                    <div name="Rewards"
                         data-bind-class-toggle="inactive:!{{$data.reward}}"
                         class="celeb_notif_reward_cntr">
                        <p name="Text"
                           data-bind-class-toggle="weap_unlock:!{{$data.currencytype}}"
                           data-bind-value="{{$data.reward}}"
                           class="celeb_notif_reward_txt"></p>
                        <div name="Currency reward"
                             data-bind-class-toggle="inactive:!{{$data.currencytype}}"
                             class="celeb_notif_reward_amount_cntr">
                            <div gue-comment="set to inactive if reward has no currency (like weapon slot unlock)"
                                 name="icon"
                                 data-bind-class="{{$data.currencytype}}"
                                 class="celeb_notif_reward_icon"></div>
                            <p name="Text"
                               gue-comment="set to inactive if reward has no currency (like weapon slot unlock)"
                               data-bind-value="{{$data.currencyamount}}"
                               data-bind-class="{{$data.currencytype}}"
                               class="celeb_notif_reward_txt_amount"></p>
                        </div>
                    </div>
                    <div name="celeb notif btn prompt"
                         data-bind-class-toggle="inactive:!{{$data.inputaction}}"
                         class="celeb_sn_notif_btn_prompt">
                        <div class="celeb_notif_btn_bkg">
                            <gbx-glyph action=""
                                       submap=""
                                       data-bind-attribute-value="{'action':{{$data.inputaction}}}"
                                       class="celeb_notif_glyph"></gbx-glyph>
                        </div>
                        <div name="celeb btn txt"
                             data-bind-value="{{$data.buttonprompt}}"
                             class="celeb_notif_contextual_txt"></div>
                    </div>
                </div>
            </div>
        </div>
        <div name="Tuba Countdown"
             class="td_celeb_notif_cntr">
            <div name="background"
                 class="td_countdown_backing"></div>
            <div name="arrows"
                 class="td_countdown_arrows"></div>
            <div name="number"
                 class="td_countdown_number"></div>
        </div>
    </div>
</widget-notification-message>
