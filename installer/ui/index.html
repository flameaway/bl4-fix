<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BL4 Fix</title>
<!-- The game's own stylesheets (tools/gen_setup_ui.py copies them from the install into game/) -->
<link rel="stylesheet" href="game/_shared/css/gbx.css">
<link rel="stylesheet" href="game/_shared/css/oakgame.css">
<link rel="stylesheet" href="game/_shared/css/oak_markup.css">
<link rel="stylesheet" href="game/_shared/css/color_tint_filters.css">
<link rel="stylesheet" href="game/_shared/css/shared_animations.css">
<link rel="stylesheet" href="game/components/gbx_button/css/gbx_button.css">
<link rel="stylesheet" href="game/components/list_button/css/list_button.css">
<link rel="stylesheet" href="game/components/main_menu_button/css/main_menu_button.css">
<link rel="stylesheet" href="game/components/pip/css/pip.css">
<link rel="stylesheet" href="game/components/toggle/css/toggle.css">
<link rel="stylesheet" href="game/components/stepper/css/stepper.css">
<link rel="stylesheet" href="game/components/text_input/css/text_input.css">
<link rel="stylesheet" href="game/components/category_divider/css/category_divider.css">
<link rel="stylesheet" href="game/menu_main/css/menu_main.css">
<link rel="stylesheet" href="game/menu_options/css/menu_options.css">
<link rel="stylesheet" href="game/title_screen/css/title_screen.css">
<link rel="stylesheet" href="game/dialog_popup/css/dialog_popup.css">
<link rel="stylesheet" href="game/celebratory_notifications/css/celebratory_notifications.css">
<link rel="stylesheet" href="setup.css">
</head>
<body>
<div id="bg">
  <div class="bg_art"></div>
  <div class="bg_shade"></div>
  <div id="claptrap" title="Claptrap">
    <div class="ct_body"><img src="game/_setup/claptrap.png" alt="" draggable="false"><div class="ct_eye"></div></div>
  </div>
</div>

<div id="titlebar">
  <div class="tb_drag" id="tb-drag"></div>
  <button class="tb_btn" id="btn-min" title="Minimize"><span class="tb_min"></span></button>
  <button class="tb_btn tb_close" id="btn-close" title="Close"><span class="tb_x"></span></button>
</div>

<!-- The title screen's main menu (menu_main.html), filled in by app.js -->
<div id="menu_slot"></div>

<div id="content">
  <div class="su_header">
    <p class="su_title" id="page-title">Loadout</p>
    <p class="su_crumb" id="page-crumb"></p>
  </div>
  <div class="su_body">
    <div class="su_entries menu_options_entry_list" id="entries"></div>
    <div class="menu_options_details_container su_details">
      <div class="menu_options_details_gradient_bg menu_options_details_gradient_bg_bottom"></div>
      <div class="menu_options_details_container_inner">
        <div class="menu_options_details">
          <div class="menu_options_details_title med_text_1" id="d-title"></div>
          <p class="su_details_meta small_text_2" id="d-meta"></p>
          <p class="menu_options_details_description small_text_2" id="d-body"></p>
          <div class="su_log" id="log" hidden></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Claptrap's lines, in the game's subtitle style -->
<div id="subs" class="hud_text_stroke">
  <p class="su_sub"><span class="su_sub_speaker">Claptrap:</span> <span id="sub-text"></span></p>
</div>

<!-- Boot: the game's title screen -->
<div id="boot"><div id="boot_slot"></div><p class="su_boot_prompt" id="boot-prompt">Connecting to ECHO-4...</p></div>

<!-- Popup (the game's dialog panel) -->
<div id="dialog" hidden>
  <div class="su_dialog">
    <div class="su_dialog_head"><p id="dialog-title"></p></div>
    <div class="su_dialog_line"></div>
    <div class="su_dialog_body" id="dialog-body"></div>
    <div class="su_dialog_line"></div>
    <div class="su_dialog_btns" id="dialog-btns"></div>
  </div>
</div>

<!-- Working: the game's vault spinner -->
<div id="working" hidden>
  <div class="su_spinner"></div>
  <p class="su_working_title" id="working-title">Installing</p>
  <div class="su_pbar"><i id="pfill"></i></div>
  <p class="su_working_line" id="working-line"></p>
</div>

<!-- Done -->
<div id="celebrate" hidden>
  <div class="su_cel_badge"></div>
  <p class="su_cel_word" id="cel-word">Installed</p>
  <p class="su_cel_sub" id="cel-sub"></p>
  <div class="su_cel_btns" id="cel-btns"></div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
