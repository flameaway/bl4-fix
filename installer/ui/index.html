<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BL4 Fix</title>
<!-- Everything here is BL4 Fix's own: art/ (SVGs, tools/gen_setup_art.py for the raster parts),
     fonts/Saira.ttf (SIL Open Font License, fonts/OFL.txt), setup.css, app.js -->
<link rel="stylesheet" href="setup.css">
</head>
<body>
<div id="bg">
  <div class="bg_art"></div>
  <div class="bg_grid"></div>
  <div class="bg_shade"></div>
  <!-- Right: the mark, huge and faint, standing on the horizon behind scan lines -->
  <div id="emblem">
    <div class="emblem_glow"></div>
    <div class="mark emblem_mark"><img class="mark_core" src="art/mark_core.svg" alt="" draggable="false"><img class="mark_ring" src="art/mark_ring.svg" alt="" draggable="false"></div>
    <div class="emblem_scan"></div>
  </div>
</div>

<div id="titlebar">
  <div class="tb_drag" id="tb-drag"></div>
  <button class="tb_btn" id="btn-min" title="Minimize"><span class="tb_min"></span></button>
  <button class="tb_btn tb_close" id="btn-close" title="Close"><span class="tb_x"></span></button>
</div>

<!-- The main menu: a panel on the left, filled in by app.js -->
<nav id="menu">
  <div class="menu_panel"><i class="menu_rail"></i><i class="menu_rail menu_rail_r"></i></div>
  <div class="menu_logo mark"><img class="mark_core" src="art/mark_core.svg" alt="" draggable="false"><img class="mark_ring" src="art/mark_ring.svg" alt="" draggable="false"></div>
  <div class="menu_list" id="menu-list"></div>
</nav>
<div class="menu_ver"><p id="menu-ver"></p></div>

<div id="content">
  <div class="su_header">
    <p class="su_title" id="page-title">Loadout</p>
    <p class="su_crumb" id="page-crumb"></p>
  </div>
  <div class="su_body">
    <div class="su_entries" id="entries"></div>
    <div class="su_details">
      <div class="su_details_glow"></div>
      <div class="su_details_inner">
        <p class="su_details_title" id="d-title"></p>
        <p class="su_details_meta" id="d-meta"></p>
        <p class="su_details_body" id="d-body"></p>
        <div class="su_log" id="log" hidden></div>
      </div>
    </div>
  </div>
</div>

<!-- Boot: the mark powering up -->
<div id="boot">
  <div class="boot_art">
    <div class="boot_glow"></div>
    <svg class="boot_bolts" id="boot-bolts" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="mark boot_mark"><img class="mark_core" src="art/mark_core.svg" alt="" draggable="false"><img class="mark_ring" src="art/mark_ring.svg" alt="" draggable="false"></div>
    <p class="boot_word">BL4 <span>Fix</span></p>
  </div>
  <p class="su_boot_prompt" id="boot-prompt">Connecting to ECHO-4...</p>
</div>

<!-- Popup -->
<div id="dialog" hidden>
  <div class="su_dialog">
    <div class="su_dialog_head"><p id="dialog-title"></p></div>
    <div class="su_dialog_line"></div>
    <div class="su_dialog_body" id="dialog-body"></div>
    <div class="su_dialog_line"></div>
    <div class="su_dialog_btns" id="dialog-btns"></div>
  </div>
</div>

<!-- Working: the mark's ring spinning round the arch -->
<div id="working" hidden>
  <div class="mark su_spinner"><img class="mark_core" src="art/mark_core.svg" alt="" draggable="false"><img class="mark_ring" src="art/mark_ring.svg" alt="" draggable="false"></div>
  <p class="su_working_title" id="working-title">Installing</p>
  <div class="su_pbar"><i id="pfill"></i></div>
  <p class="su_working_line" id="working-line"></p>
</div>

<!-- Done -->
<div id="celebrate" hidden>
  <div class="mark su_cel_badge"><img class="mark_core" src="art/mark_core.svg" alt="" draggable="false"><img class="mark_ring" src="art/mark_ring.svg" alt="" draggable="false"></div>
  <p class="su_cel_word" id="cel-word">Installed</p>
  <p class="su_cel_sub" id="cel-sub"></p>
  <div class="su_cel_btns" id="cel-btns"></div>
</div>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
