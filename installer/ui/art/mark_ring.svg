<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- The mark's outer part: a segmented metal ring with gold light lines (our own drawing of a
       vault symbol). Drawn over mark_core.svg (the arch), so the arch's feet tuck under it; the
       spinner turns this layer on its own. -->
  <defs>
    <linearGradient id="metal" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#b3a47c"/>
      <stop offset="0.3" stop-color="#6f6550"/>
      <stop offset="0.62" stop-color="#3f3b31"/>
      <stop offset="1" stop-color="#202224"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8c79a"/>
      <stop offset="1" stop-color="#6d5f3e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Ring body with dark rims -->
  <circle cx="128" cy="128" r="107" fill="none" stroke="#0a0c0d" stroke-width="23"/>
  <circle cx="128" cy="128" r="107" fill="none" stroke="url(#metal)" stroke-width="18"/>
  <!-- Raised plates on the ring: upper left and upper right, lower left and lower right -->
  <g fill="url(#plate)" fill-opacity="0.55" stroke="#0a0c0d" stroke-width="1.4">
    <path d="M38.6 76 A103 103 0 0 1 76 38.6 L80 45.5 A95 95 0 0 0 45.5 80 Z"/>
    <path d="M180 38.6 A103 103 0 0 1 217.4 76 L210.5 80 A95 95 0 0 0 176 45.5 Z"/>
    <path d="M27 150 A103 103 0 0 0 40 182 L47 178 A95 95 0 0 1 35 148.5 Z"/>
    <path d="M216 182 A103 103 0 0 0 229 150 L221 148.5 A95 95 0 0 1 209 178 Z"/>
  </g>
  <!-- Panel seams across the ring -->
  <g stroke="#0a0c0d" stroke-width="2.2">
    <path d="M128 16 V36"/>
    <path d="M128 220 V240"/>
    <path d="M24.6 98 L43 103"/>
    <path d="M231.4 98 L213 103"/>
    <path d="M57 205 L69 190"/>
    <path d="M199 205 L187 190"/>
    <path d="M90 22 L95 41"/>
    <path d="M166 22 L161 41"/>
  </g>
  <!-- Gold light lines: one round the inside edge, broken in segments; a thinner one outside -->
  <g fill="none" filter="url(#glow)">
    <circle cx="128" cy="128" r="100" stroke="#ffc84a" stroke-width="2.4" stroke-dasharray="70 9 38 9 104 9 52 9 80 9 63 9 70 9" stroke-dashoffset="20"/>
    <circle cx="128" cy="128" r="113.5" stroke="#f2a73b" stroke-opacity="0.8" stroke-width="1.3" stroke-dasharray="44 18 92 18 30 18 120 18 66 18 108 18" stroke-dashoffset="5"/>
  </g>
  <!-- Highlight along the top of the metal -->
  <path d="M40 80 A100 100 0 0 1 216 80" fill="none" stroke="#f4eccf" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
